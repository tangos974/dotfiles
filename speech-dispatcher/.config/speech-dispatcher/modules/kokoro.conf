# FastKoko (Kokoro-FastAPI) output module for speech-dispatcher, built on the
# sd_generic plugin: no code, just this config calling a helper script that
# POSTs to the OpenAI-compatible /v1/audio/speech endpoint and plays the
# result. Modeled on the mimic3-generic.conf shipped with speech-dispatcher.

Debug 0

# The pipeline must go silent on SIGKILL (sd_generic kills it to stop/cancel
# speech) and must print nothing on stdout, or sd_generic hangs.
GenericExecuteSynth \
"printf %s \'$DATA\' | /home/tang/.local/bin/kokoro-speak \'$VOICE\' $RATE"

GenericCmdDependency "curl"
GenericCmdDependency "jq"
GenericCmdDependency "mpv"

GenericDefaultCharset "utf-8"

# $RATE = speechd_rate * (Multiply/100) + Add, with speechd_rate in -100..100
# (multipliers are stored x100 because dotconf has no floats). This yields
# 25..175, which kokoro-speak divides by 100 for the API's `speed` parameter
# (1.0 = normal, API accepts 0.25..4.0).
GenericRateAdd          100
GenericRateMultiply     75

# Kokoro voice ids: prefix = language+gender (af = American female, am =
# American male, ff = French female). Only the French and American-English
# voices are listed — the server has more (British, es/it/hi/ja/pt/zh); add
# AddVoice lines here to expose them to spd-say -y and the Waybar picker.
# Symbolic types repeat past 3 per gender — duplicates are fine, the first
# entry per type wins for symbolic lookup. Server list:
# curl http://inference.home:8880/v1/audio/voices
AddVoice        "en"    "FEMALE1"       "af_heart"
AddVoice        "en"    "FEMALE2"       "af_bella"
AddVoice        "en"    "FEMALE3"       "af_nicole"
AddVoice        "en"    "FEMALE1"       "af_alloy"
AddVoice        "en"    "FEMALE2"       "af_aoede"
AddVoice        "en"    "FEMALE3"       "af_jadzia"
AddVoice        "en"    "FEMALE1"       "af_jessica"
AddVoice        "en"    "FEMALE2"       "af_kore"
AddVoice        "en"    "FEMALE3"       "af_nova"
AddVoice        "en"    "FEMALE1"       "af_river"
AddVoice        "en"    "FEMALE2"       "af_sarah"
AddVoice        "en"    "FEMALE3"       "af_sky"
AddVoice        "en"    "MALE1"         "am_michael"
AddVoice        "en"    "MALE2"         "am_adam"
AddVoice        "en"    "MALE3"         "am_echo"
AddVoice        "en"    "MALE1"         "am_eric"
AddVoice        "en"    "MALE2"         "am_fenrir"
AddVoice        "en"    "MALE3"         "am_liam"
AddVoice        "en"    "MALE1"         "am_onyx"
AddVoice        "en"    "MALE2"         "am_puck"
AddVoice        "en"    "MALE3"         "am_santa"
AddVoice        "fr"    "FEMALE1"       "ff_siwis"

DefaultVoice    "af_heart"
