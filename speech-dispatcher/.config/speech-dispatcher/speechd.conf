# Thin user config — when this file exists it replaces
# /etc/speech-dispatcher/speechd.conf entirely; anything not set here falls
# back to speech-dispatcher's compiled-in defaults.
#
# Route all speech to FastKoko (Kokoro-FastAPI) on the homelab inference box
# through the generic output module (modules/kokoro.conf).

AddModule "kokoro" "sd_generic" "kokoro.conf"
DefaultModule kokoro

# Symbolic voice used when a client doesn't pick one; kokoro.conf maps it
# per-language (en -> af_heart, fr -> ff_siwis, ...).
DefaultVoiceType "FEMALE1"
